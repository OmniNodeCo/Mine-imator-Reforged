# Mine-imator Reforged - release automation.
#
# What it does:
#   1. Resolves the newest successful "Build check" run for the release commit
#      (or an explicit run id) and verifies its platform artifacts exist.
#   2. Fetches Minecraft Java assets (piston-meta -> client jars -> Mine-imator
#      .zip/.midata packages) for the configured range (default 1.21 through
#      26.3) plus the auto-resolved latest release.
#   3. Injects the fetched assets into each platform zip from that build run
#      (no recompilation) and publishes a GitHub Release with per-platform
#      builds + the assets bundle.
#
# How to cut a release:
#   * Bump `mineimator_version_sub` in GmProject/scripts/macros/macros.gml and
#     add a CHANGELOG.md entry, push, and wait for a green "Build check" on
#     that commit - then push tag `reforged-v<version>`
#     (e.g. `git tag reforged-v1.1.0 && git push origin reforged-v1.1.0`).
#     The tag MUST point at a commit with green builds; if a tag push races
#     the build, just run this workflow manually with the same tag afterwards.
#   * Or run this workflow manually (Actions -> Release -> Run workflow),
#     optionally overriding the tag, MC range, platforms, or build run id.
#
# Releases take minutes plus the asset fetch (~10-30 min with a warm cache);
# the heavy Qt/app compilation happens in Build check, not here.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: reforged-v<fork version from macros>)"
        required: false
        default: ""
      mc_range:
        description: "Minecraft assets range (start:end, empty end = latest)"
        required: false
        default: "1.21:26.3"
      no_latest:
        description: "Do NOT auto-include the latest Minecraft release"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Comma-separated: windows,linux,macos"
        required: false
        default: "windows,linux,macos"
      build_run_id:
        description: "Build check run id to release (default: newest green run for this commit)"
        required: false
        default: ""
      publish:
        description: "Publish the GitHub Release (else artifacts only)"
        required: false
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "reforged-v*"

permissions:
  contents: write
  actions: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      fork_version: ${{ steps.plan.outputs.fork_version }}
      mc_range: ${{ steps.plan.outputs.mc_range }}
      latest_flag: ${{ steps.plan.outputs.latest_flag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      bundle: ${{ steps.plan.outputs.bundle }}
      build_run: ${{ steps.plan.outputs.build_run }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve tag, build run and platform matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RANGE: ${{ inputs.mc_range }}
          INPUT_NO_LATEST: ${{ inputs.no_latest }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_BUILD_RUN: ${{ inputs.build_run_id }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, urllib.request, urllib.error

          API = "https://api.github.com"
          repo = os.environ["REPO"]
          token = os.environ["GITHUB_TOKEN"]
          sha = os.environ["SHA"]

          macros = open("GmProject/scripts/macros/macros.gml").read()
          m = re.search(r'#macro mineimator_version_sub\s+"Reforged ([^"]+)"', macros)
          if not m:
              sys.exit("error: cannot find Reforged version in macros.gml")
          fork_version = m.group(1)

          event = os.environ["EVENT"]
          ref = os.environ.get("REF", "")
          inp = lambda k: os.environ.get(k, "").strip()

          tag = inp("INPUT_TAG") or (ref if event == "push" else "") or ("reforged-v" + fork_version)
          if event == "push" and tag != "reforged-v" + fork_version:
              sys.exit("error: tag %s does not match macros version Reforged %s" % (tag, fork_version))

          mc_range = inp("INPUT_RANGE") or "1.21:26.3"
          include_latest = inp("INPUT_NO_LATEST").lower() != "true"
          wanted = [p.strip().lower() for p in (inp("INPUT_PLATFORMS") or "windows,linux,macos").split(",")]
          labels = {"windows": "Windows-x64", "linux": "Linux-x64", "macos": "macOS-x64"}
          unknown = [p for p in wanted if p not in labels]
          if unknown:
              sys.exit("error: unknown platform(s): %s" % ", ".join(unknown))
          matrix = {"include": [{"id": p} for p in wanted]}

          publish = "true" if event == "push" else ("true" if inp("INPUT_PUBLISH").lower() == "true" else "false")
          prerelease = "false" if event == "push" else ("true" if inp("INPUT_PRERELEASE").lower() == "true" else "false")

          def api(path):
              req = urllib.request.Request(API + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Mine-imator-Reforged-release",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  sys.exit("error: GitHub API %s failed: HTTP %s: %s"
                           % (path, e.code, e.read()[:200]))

          override = inp("INPUT_BUILD_RUN")
          if override:
              try:
                  run_id = int(override)
              except ValueError:
                  sys.exit("error: build_run_id must be a workflow run id, got '%s'" % override)
              run = api("/repos/%s/actions/runs/%d" % (repo, run_id))
              if not run.get("path", "").endswith("/build.yml"):
                  sys.exit("error: run %d is from %s, not build.yml"
                           % (run_id, run.get("path")))
              state = "%s/%s" % (run.get("status"), run.get("conclusion"))
              if state != "completed/success":
                  sys.exit("error: build run %d is %s; need a completed/success run"
                           % (run_id, state))
          else:
              data = api("/repos/%s/actions/workflows/build.yml/runs?status=completed&per_page=50" % repo)
              run = next((r for r in data.get("workflow_runs", [])
                          if r.get("conclusion") == "success" and r.get("head_sha") == sha), None)
              if run is None:
                  sys.exit("error: no successful 'Build check' run for commit %s. "
                           "Push the release commit and wait for green builds first "
                           "(commits touching only *.md/Branding skip Build check), "
                           "then retry - or pass an explicit build_run_id." % sha)
              run_id = run["id"]

          print("Build run: %s (commit %s, ref %s)"
                % (run.get("html_url"), run.get("head_sha"), run.get("head_branch")))

          arts = api("/repos/%s/actions/runs/%d/artifacts?per_page=100" % (repo, run_id))
          arts = arts.get("artifacts", [])
          mapping, problems = {}, []
          for pid in wanted:
              matches = [a for a in arts
                         if a["name"].startswith("Mine-imator-Reforged-")
                         and a["name"].endswith("-" + labels[pid])]
              live = [a["name"] for a in matches if not a.get("expired")]
              if len(live) == 1:
                  mapping[pid] = live[0]
              elif matches and not live:
                  problems.append("%s: artifacts expired (Build check keeps them 30 days)" % pid)
              elif not matches:
                  problems.append("%s: no matching artifact (was that platform's build green?)" % pid)
              else:
                  problems.append("%s: multiple matching artifacts: %s" % (pid, ", ".join(live)))
          if problems:
              have = ", ".join(sorted(a["name"] for a in arts)) or "(none)"
              sys.exit("error: build run %d unusable:\n  %s\n  artifacts in run: %s\n"
                       "  Fix: re-run Build check for this commit, or pass another build_run_id."
                       % (run_id, "\n  ".join(problems), have))

          out = {
              "tag": tag,
              "fork_version": fork_version,
              "mc_range": mc_range,
              "latest_flag": "--latest" if include_latest else "",
              "matrix": json.dumps(matrix),
              "publish": publish,
              "prerelease": prerelease,
              "bundle": "minecraft-assets-" + mc_range.replace(":", "-"),
              "build_run": str(run_id),
              "artifacts": json.dumps(mapping),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in out.items():
                  f.write("%s=%s\n" % (k, v))
          print(json.dumps(out, indent=2))
          EOF

  assets:
    name: Fetch Minecraft assets
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache client jars + manifest
        uses: actions/cache@v4
        with:
          path: ~/.cache/mine-imator-reforged
          key: mc-assets-v1-${{ needs.plan.outputs.mc_range }}-${{ hashFiles('Tools/fetch_minecraft_assets.py') }}
          restore-keys: mc-assets-v1-

      - name: Fetch + package assets (${{ needs.plan.outputs.mc_range }})
        run: |
          python3 Tools/fetch_minecraft_assets.py \
            --range "${{ needs.plan.outputs.mc_range }}" \
            ${{ needs.plan.outputs.latest_flag }} \
            --out staging/minecraft-assets \
            --workers 4
          ls -la staging/minecraft-assets | head -n 20

      - name: Upload assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-assets
          path: staging/minecraft-assets
          retention-days: 30

  fetch:
    name: Fetch latest build (${{ matrix.id }})
    needs: [plan, assets]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Minecraft assets
        uses: actions/download-artifact@v4
        with:
          name: minecraft-assets
          path: staging/minecraft-assets

      - name: Download ${{ matrix.id }} build (run ${{ needs.plan.outputs.build_run }})
        uses: actions/download-artifact@v4
        with:
          name: ${{ fromJSON(needs.plan.outputs.artifacts)[matrix.id] }}
          run-id: ${{ needs.plan.outputs.build_run }}
          github-token: ${{ github.token }}
          path: staging/build

      # Same guard as the old bundle step: only per-version files go into
      # Data/Minecraft, never the feed files (versions.midata,
      # assets-index.json, minecraft_latest.txt) - the app lists every
      # *.midata there as a selectable version. Windows zips store Data/ at
      # the root while Unix zips nest it under Mine-imator/, so the prefix is
      # detected from the committed 1.20.2 anchor present in every build.
      - name: Inject assets into platform zip
        run: |
          python3 - <<'EOF'
          import glob, os, re, sys, zipfile

          zips = glob.glob("staging/build/*.zip")
          if len(zips) != 1:
              sys.exit("error: expected 1 platform zip, found: %s" % zips)
          zpath = zips[0]

          with zipfile.ZipFile(zpath) as z:
              names = z.namelist()
          anchor = next((n for n in names
                         if re.fullmatch(r"(.*/)?Data/Minecraft/1\.20\.2\.midata", n)), None)
          if anchor is None:
              sys.exit("error: no Data/Minecraft/1.20.2.midata in %s; first entries: %s"
                       % (zpath, names[:30]))
          prefix = anchor[:anchor.index("Data/Minecraft/")]

          files = sorted(glob.glob("staging/minecraft-assets/[0-9]*.zip") +
                         glob.glob("staging/minecraft-assets/[0-9]*.midata"))
          if not files:
              sys.exit("error: no per-version asset files in staging/minecraft-assets")
          have = set(names)
          added, skipped = 0, 0
          with zipfile.ZipFile(zpath, "a", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for path in files:
                  arc = prefix + "Data/Minecraft/" + os.path.basename(path)
                  if arc in have:
                      skipped += 1
                      continue
                  z.write(path, arc)
                  have.add(arc)
                  added += 1
          print("Injected %d file(s) into %s (%d already present, skipped)"
                % (added, zpath, skipped))
          EOF
          ls -la staging/build/

      - name: Upload ${{ matrix.id }} release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ fromJSON(needs.plan.outputs.artifacts)[matrix.id] }}
          path: staging/build/*.zip
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [plan, assets, fetch]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Bundle Minecraft assets + write release notes
        run: |
          python3 - <<'EOF'
          import glob, json, os, zipfile

          tag = os.environ["TAG"]
          fork_version = os.environ["FORK_VERSION"]
          bundle = os.environ["BUNDLE"] + ".zip"

          with zipfile.ZipFile("dist/" + bundle, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for path in sorted(glob.glob("dist/minecraft-assets/*")):
                  z.write(path, os.path.basename(path))

          index = json.load(open("dist/minecraft-assets/assets-index.json"))
          versions = sorted(index["versions"])
          latest = open("dist/minecraft-assets/minecraft_latest.txt").read().strip()

          notes = []
          notes.append("# Mine-imator Reforged %s" % fork_version)
          notes.append("")
          try:
              changelog = open("CHANGELOG.md").read().splitlines()
              section = []
              for line in changelog[1:]:
                  if line.startswith("## ") and section:
                      break
                  section.append(line)
              notes.extend(section)
              notes.append("")
          except OSError:
              pass
          notes.append("## Minecraft assets (%d versions, latest %s)" % (len(versions), latest))
          notes.append("")
          notes.append("Bundled and selectable in Settings: " + ", ".join(versions))
          notes.append("")
          notes.append("Install: extract the archive for your platform and run "
                       "Mine-imator (Windows: Mine-imator.exe). Your projects live in "
                       "Projects/ next to the executable (Windows) or ~/Mine-imator "
                       "(macOS/Linux).")
          open("dist/RELEASE_NOTES.md", "w").write("\n".join(notes) + "\n")
          print("\n".join(notes))
          EOF
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          FORK_VERSION: ${{ needs.plan.outputs.fork_version }}
          BUNDLE: ${{ needs.plan.outputs.bundle }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: Mine-imator Reforged ${{ needs.plan.outputs.fork_version }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ needs.plan.outputs.prerelease }}
          files: |
            dist/*.zip
            dist/*/*.zip
