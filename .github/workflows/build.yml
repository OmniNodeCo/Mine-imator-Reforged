# Mine-imator Reforged - continuous integration.
#
# Fast checks (minutes, no Qt): GML->C++ conversion, CppGen compilation, asset
# pipeline self-test + live manifest checks, workflow YAML validation.
# Full builds: real Windows x64 / Linux x64 / macOS x86_64 Release builds via
# the shared build-app action. Qt compiles from source on the first run and is
# cached afterwards. Build artifacts are kept 30 days: release.yml publishes
# the newest green build for the release commit instead of recompiling.
# Tag pushes are ignored here - the Release workflow owns tags.

name: Build check

on:
  push:
    tags-ignore:
      - "**"
    paths-ignore:
      - "**.md"
      - "Branding/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "Branding/**"
  workflow_dispatch:
  # Auto-build the commit a tag-triggered Release published, so a re-run of
  # the Release workflow can bundle fresh binaries without a manual dispatch.
  # (workflow_run only fires for workflows on the default branch.)
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cppgen:
    name: CppGen (convert + compile)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Convert GML to C++ (validates all game sources)
        run: |
          chmod +x CppGen/Linux/CppGen
          ./CppGen/Linux/CppGen "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/CppGen/gml.json"
          test -f CppProject/Generated/Scripts.hpp

      - name: Compile CppGen from source
        run: |
          cmake -S CppGen -B build-cppgen -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cppgen --parallel

  assets:
    name: Asset pipeline
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline self-test (packaging round-trip + range logic)
        run: python3 Tools/fetch_minecraft_assets.py --self-test

      - name: Live manifest check (resolves latest, downloads nothing)
        run: python3 Tools/fetch_minecraft_assets.py --latest --dry-run

      - name: Live range check (validates release.yml's default range)
        run: python3 Tools/fetch_minecraft_assets.py --range 1.21:26.3 --dry-run

      - name: Validate workflow/action YAML
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install pyyaml
          python3 -c "
          import glob, yaml
          for path in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/actions/*/action.yml')):
              yaml.safe_load(open(path))
              print('OK', path)
          "

  build:
    name: Build (${{ matrix.id }})
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows, os: windows-2025 }
          - { id: linux, os: ubuntu-24.04 }
          - { id: macos, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build + package
        uses: ./.github/actions/build-app
        with:
          platform: ${{ matrix.id }}
          retention-days: 30
