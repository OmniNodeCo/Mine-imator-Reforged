# Shared full-platform build: dependencies + cached Qt + Release + package.
# Used by build.yml (every push/PR) and release.yml (releases) so the build
# logic exists exactly once. Expects a checked-out repo; on entry the caller
# may already have bundled Minecraft assets + stamped versions (release.yml).
# Produces <Mine-imator-Reforged-<ver>-<OS>-x64>.zip as an artifact.

name: Build app
description: Full Mine-imator Reforged platform build via the Setup scripts.

inputs:
  platform:
    description: "Target platform: windows, linux or macos"
    required: true
  retention-days:
    description: "Artifact retention"
    required: false
    default: "7"

runs:
  using: composite
  steps:
    - name: Resolve artifact name
      id: names
      shell: bash
      run: |
        case "${{ inputs.platform }}" in
          windows) label="Windows-x64" ;;
          linux) label="Linux-x64" ;;
          macos) label="macOS-x64" ;;
          *) echo "error: unknown platform '${{ inputs.platform }}'"; exit 1 ;;
        esac
        ver="$(sed -n 's/.*#macro mineimator_version_sub[[:space:]]*"\([^"]*\)".*/\1/p' GmProject/scripts/macros/macros.gml)"
        if [ -z "$ver" ]; then echo "error: cannot find version_sub in macros.gml"; exit 1; fi
        ver="${ver##* }"
        echo "zip=Mine-imator-Reforged-$ver-$label" >> "$GITHUB_OUTPUT"
        echo "Building Mine-imator-Reforged-$ver-$label"

    - name: Set up Windows build environment
      if: inputs.platform == 'windows'
      shell: pwsh
      run: |
        echo "DEV_DIR=C:\Dev" >> $env:GITHUB_ENV
        choco install strawberryperl -y --no-progress

    - name: Cache Qt (Windows)
      if: inputs.platform == 'windows'
      uses: actions/cache@v4
      with:
        path: |
          C:/Dev/Qt/5.15.19/install
          C:/Dev/Qt/5.15.19/qt5
        key: qt-windows-x64-v1-${{ hashFiles('Setup.ps1', 'WinUtils.ps1') }}
        restore-keys: qt-windows-x64-v1-

    - name: Set up Linux build environment
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        echo "DEV_DIR=$HOME/Dev" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        # `apt-get build-dep` needs deb-src entries. add-apt-repository's
        # --enable-source exits 0 on Ubuntu 24.04 without actually editing
        # the DEB822 ubuntu.sources file, so patch it directly (falling back
        # to add-apt-repository only on legacy sources.list layouts).
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        else
          sudo add-apt-repository -y --enable-source
        fi
        if ! grep -rq "deb-src" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; then
          echo "error: no deb-src entry found after enabling source repositories" >&2
          cat /etc/apt/sources.list 2>/dev/null >&2 || true
          cat /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null >&2 || true
          exit 1
        fi
        sudo apt-get update
        sudo apt-get build-dep -y qtbase5-dev
        # System libraries linked by CppProject/CMakeLists.txt (Linux build).
        # nettle-dev replaced libnettle-dev on Ubuntu 24.04+.
        sudo apt-get install -y git cmake perl clang libomp-dev \
          libx264-dev libgnutls28-dev libsndio-dev \
          libva-dev libvdpau-dev libbz2-dev liblzma-dev
        sudo apt-get install -y nettle-dev || sudo apt-get install -y libnettle-dev

    - name: Cache Qt (Linux)
      if: inputs.platform == 'linux'
      uses: actions/cache@v4
      with:
        path: |
          ~/Dev/Qt/5.15.19/install
          ~/Dev/Qt/5.15.19/qt5
        key: qt-linux-x64-v1-${{ hashFiles('Setup.sh') }}
        restore-keys: qt-linux-x64-v1-

    - name: Set up macOS build environment
      if: inputs.platform == 'macos'
      shell: bash
      run: |
        echo "DEV_DIR=$HOME/Dev" >> $GITHUB_ENV
        brew install cmake libomp
        # Best effort: lets any x86_64 helper binary run on ARM runners.
        sudo softwareupdate --install-rosetta --agree-to-license || true
        # The committed CppGen is x86_64-only; build a native one instead.
        cmake -S CppGen -B build-cppgen -DCMAKE_BUILD_TYPE=Release
        cmake --build build-cppgen --parallel
        cp build-cppgen/CppGen CppGen/Mac/CppGen

    - name: Cache Qt (macOS)
      if: inputs.platform == 'macos'
      uses: actions/cache@v4
      with:
        path: |
          ~/Dev/Qt/5.15.19/install
          ~/Dev/Qt/5.15.19/qt5
        key: qt-macos-x86_64-v1-${{ hashFiles('Setup.sh') }}
        restore-keys: qt-macos-x86_64-v1-

    - name: Build dependencies + Qt (Windows)
      if: inputs.platform == 'windows'
      shell: pwsh
      env:
        SETUP_NON_INTERACTIVE: '1'
      run: ./Setup.ps1 Qt

    - name: Build dependencies + Qt (Linux)
      if: inputs.platform == 'linux'
      shell: bash
      env:
        SETUP_NON_INTERACTIVE: '1'
      run: ./Setup.sh Qt

    - name: Build dependencies + Qt (macOS x86_64)
      if: inputs.platform == 'macos'
      shell: bash
      env:
        SETUP_NON_INTERACTIVE: '1'
      run: ./Setup.sh Qt x86_64

    - name: Release build (Windows)
      if: inputs.platform == 'windows'
      shell: pwsh
      run: ./Setup.ps1 Release

    - name: Release build (Linux)
      if: inputs.platform == 'linux'
      shell: bash
      run: ./Setup.sh Release

    - name: Release build (macOS x86_64)
      if: inputs.platform == 'macos'
      shell: bash
      run: ./Setup.sh Release x86_64

    # Run the freshly built app once (on a copy of the install folder, so the
    # packaged zip stays pristine) and dump its log. A healthy run reaches the
    # "Assets stage:" loading-screen trace within the wait time; a crash, hang
    # or missing-file dialog before that fails the step with the log printed.
    - name: Smoke test (Windows)
      if: inputs.platform == 'windows'
      shell: pwsh
      run: |
        $src = "install/Mine-imator"
        $dir = "smoke-run/Mine-imator"
        New-Item -ItemType Directory -Force -Path "smoke-run" | Out-Null
        Copy-Item -Recurse $src $dir
        $p = Start-Process -FilePath "$dir/Mine-imator.exe" -WorkingDirectory $dir -PassThru
        if ($p.WaitForExit(90000)) {
          "SMOKE: app exited by itself with code $($p.ExitCode)"
          $exited = $true
        } else {
          "SMOKE: app still running after 90s (expected for a healthy GUI app) - stopping it"
          Stop-Process -Id $p.Id -Force
          $exited = $false
        }
        $log = Join-Path $dir "log.txt"
        "SMOKE: ----- log.txt -----"
        if (-not (Test-Path $log)) {
          "SMOKE: no log.txt was created - the app died before logging anything"
          exit 1
        }
        Get-Content $log | ForEach-Object { "SMOKE: $_" }
        "SMOKE: ----- end of log -----"
        $content = Get-Content $log -Raw
        if ($content -match "FATAL|Missing file|Could not unzip") {
          "SMOKE: FAILED - fatal error in log"
          exit 1
        }
        if ($content -notmatch "Assets stage: ") {
          "SMOKE: FAILED - log shows no asset-loading progress (app never reached the loading screen)"
          exit 1
        }
        "SMOKE: OK - app reached the asset loading stage"

    - name: Smoke test (Linux)
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        set -uo pipefail
        sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null 2>&1 || sudo apt-get install -y -q xvfb >/dev/null 2>&1 || true
        cp -r install/Mine-imator smoke-run-Mine-imator
        cd smoke-run-Mine-imator
        set +e
        xvfb-run -a -s "-screen 0 1280x800x24" env LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb timeout 90s ./Mine-imator
        code=$?
        set -e
        echo "SMOKE: app exit code: $code (124 = still running at timeout, expected for a healthy GUI app)"
        echo "SMOKE: ----- log.txt -----"
        if [ ! -f log.txt ]; then
          echo "SMOKE: no log.txt was created - the app died before logging anything"
          exit 1
        fi
        sed "s/^/SMOKE: /" log.txt
        echo "SMOKE: ----- end of log -----"
        if grep -qE "FATAL|Missing file|Could not unzip" log.txt; then
          echo "SMOKE: FAILED - fatal error in log"
          exit 1
        fi
        if grep -q "shaders_are_supported: no" log.txt; then
          echo "SMOKE: SKIP - no OpenGL on this runner, cannot test further"
          exit 0
        fi
        if ! grep -q "Assets stage: " log.txt; then
          echo "SMOKE: FAILED - log shows no asset-loading progress (app never reached the loading screen)"
          exit 1
        fi
        echo "SMOKE: OK - app reached the asset loading stage"

    - name: Package (Windows)
      if: inputs.platform == 'windows'
      shell: pwsh
      run: |
        Compress-Archive -Path install/Mine-imator/* `
          -DestinationPath "${{ steps.names.outputs.zip }}.zip" -Force

    - name: Package (Unix)
      if: inputs.platform != 'windows'
      shell: bash
      run: |
        cd install && zip -qr "../${{ steps.names.outputs.zip }}.zip" Mine-imator && cd ..
        ls -la "${{ steps.names.outputs.zip }}.zip"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.names.outputs.zip }}
        path: ${{ steps.names.outputs.zip }}.zip
        retention-days: ${{ inputs.retention-days }}
